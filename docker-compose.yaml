services:
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./site:/usr/share/nginx/html
      - ./site/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api   # nginx precisa achar o host "api"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1024M

  # Sem porta no host
  mysql:
    image: mysql:8.4
    container_name: mysql
    env_file:
      - ./mysql.env   # Senhas
    environment:
      MYSQL_DATABASE: BancoNexus
      MYSQL_USER: nexusConnection
    volumes:
      - ./DB:/var/lib/mysql                        # Dados
      - ./SQLinit:/docker-entrypoint-initdb.d:ro   # Scripts iniciais
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build: ./api
    container_name: api
    env_file:
      - ./api/.env
    depends_on:
      mysql:
        condition: service_healthy   # Espera o banco
    expose:
      - "8000"
    volumes:
      - D:\Data docker\Storage:/app/storage
      - D:\Data Docker\logs:/app/logs
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1024M

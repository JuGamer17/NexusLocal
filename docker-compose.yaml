services:
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./site:/usr/share/nginx/html
      - ./site/nginx.conf:/etc/nginx/conf.d/default.conf
      

    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1024M

  api:
    build: ./api
    container_name: api
    env_file:
      - ./api/.env
    expose:
      - "8000"
    volumes:
      - D:\Data docker\Storage:/app/storage
      - D:\Data Docker\logs:/app/logs

    deploy:
      resources:
        limits:

          cpus: "2"
          memory: 1024M
    